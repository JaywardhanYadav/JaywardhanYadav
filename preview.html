<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GitHub Profile Hero Banners - Approved Preview</title>
  <style>
    body {
      background-color: #0b0f19;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }
    .toolbar {
      display: flex;
      gap: 15px;
      align-items: center;
      justify-content: center;
      background: rgba(15, 23, 42, 0.8);
      padding: 12px 24px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
      color: #10b981;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }
    button {
      padding: 8px 18px;
      font-weight: 600;
      font-size: 13px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 8px;
      cursor: pointer;
      background: #22d3ee;
      color: #030712;
      transition: all 0.2s ease;
    }
    button:hover {
      transform: translateY(-1px);
      filter: brightness(1.1);
    }
    .preview-card {
      max-width: 1280px;
      width: 100%;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 24px;
      padding: 20px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }
    .preview-card.light-card {
      background: #e2e8f0;
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }
    .preview-card.light-card h2 {
      color: #0f172a;
    }
    h2 {
      margin-top: 0;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    object {
      width: 100%;
      height: auto;
      aspect-ratio: 1280 / 780;
      display: block;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <div class="badge"><span class="dot"></span> Approved Banners Live (Links Clickable)</div>
    <button onclick="location.reload()">🔄 Refresh</button>
  </div>

  <div class="preview-card">
    <h2>🌙 Dark Mode (dark.svg)</h2>
    <object id="dark-img" type="image/svg+xml" data="dark.svg"></object>
  </div>

  <div class="preview-card light-card">
    <h2>☀️ Light Mode (light.svg)</h2>
    <object id="light-img" type="image/svg+xml" data="light.svg"></object>
  </div>

  <script>
    const t = Date.now();
    document.getElementById('dark-img').data = 'dark.svg?t=' + t;
    document.getElementById('light-img').data = 'light.svg?t=' + t;
  </script>
</body>
</html>
